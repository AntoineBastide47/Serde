name: Serde CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows x64
          - os: windows-latest
            name: Windows x86
            cxx_flags: -m32

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake llvm-17-dev libclang-17-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.cxx_flags }}" \
            -DSERDE_BUILD_TESTS=ON \
            -DHF_BUILD_TESTS=ON \
            -DSERDE_BUILD_HEADER_FORGE=OFF
          cmake --build build --parallel
          ./build/json_test_suite ./build/_deps/jsontestsuite-src/test_parsing
          ./build/hf_test_suite
          ./build/serde_test_suite

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: ./serde.sh test

  bench:
    name: Benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake llvm-17-dev libclang-17-dev

      - name: Run benchmark
        run: ./serde.sh bench | tee bench-output.txt

      - name: Post results to job summary
        if: always()
        run: |
          echo "## Serde Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "Loading files" bench-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
