name: Serde CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows x64
            arch: x64
            llvm_installer: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win64.exe
          - os: windows-latest
            name: Windows x86
            arch: Win32
            llvm_installer: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/LLVM-17.0.6-win32.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake llvm-17-dev libclang-17-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-17.0.6-${{ matrix.arch }}

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        id: install-llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17.0.6"
          directory: C:\LLVM
          cached: ${{ steps.cache-llvm.outputs.cache-hit }}

      - name: Configure paths (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install cmake --confirm
          Add-Content $env:GITHUB_ENV "LLVM_DIR=C:\LLVM\lib\cmake\llvm"
          Add-Content $env:GITHUB_ENV "Clang_DIR=C:\LLVM\lib\cmake\clang"
          Add-Content $env:GITHUB_ENV "CMAKE_GENERATOR_PLATFORM=${{ matrix.arch }}"

      - name: Run tests
        shell: bash
        run: ./serde.sh test

  bench:
    name: Benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake llvm-17-dev libclang-17-dev

      - name: Run benchmark
        run: ./serde.sh bench | tee bench-output.txt

      - name: Post results to job summary
        if: always()
        run: |
          echo "## Serde Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "Loading files" bench-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
